services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: message-polishing:local
    env_file:
      - path: .env
        required: false
    environment:
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      UPSTAGE_BASE_URL: ${UPSTAGE_BASE_URL:-https://api.upstage.ai/v1}
      UPSTAGE_MODEL: ${UPSTAGE_MODEL:-solar-pro3}
      UPSTAGE_TEMPERATURE: ${UPSTAGE_TEMPERATURE:-0.2}
      UPSTAGE_TIMEOUT_SECONDS: ${UPSTAGE_TIMEOUT_SECONDS:-60}
      MESSAGE_POLISHING_MAX_FEEDBACK_ITERATIONS: ${MESSAGE_POLISHING_MAX_FEEDBACK_ITERATIONS:-2}
      MESSAGE_POLISHING_TRACE: ${MESSAGE_POLISHING_TRACE:-0}
    ports:
      - "${MESSAGE_POLISHING_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
